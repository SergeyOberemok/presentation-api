[project]
name = "presentation-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Serhii Oberemok", email = "Serhii.Oberemok@ibm.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncer>=0.0.18",
    "faker>=40.41.0",
    "fastapi[standard]>=0.142.2",
    "ipykernel>=7.4.0",
]

[project.scripts]
presentation-api = "presentation_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
